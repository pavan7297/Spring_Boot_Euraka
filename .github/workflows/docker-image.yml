name: Build & Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t pavansrinivas32/springboot-euraka:latest .
          # docker tag pavansrinivas32/springboot-euraka:latest pavansrinivas32/springboot-euraka:${{ github.sha }}

      - name: Push Docker Image
        run: |
          docker push pavansrinivas32/springboot-euraka:latest
          # docker push pavansrinivas32/springboot-euraka:${{ github.sha }}
